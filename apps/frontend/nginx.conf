worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  # non-root 実行のため一時パスを書き込み可能な場所へ
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # 画像アップロード上限（設計書 9.3: 1 ファイル最大 20 MiB）
  client_max_body_size 24m;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy
      "default-src 'self'; img-src 'self' blob: data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Docker の埋め込み DNS を使い、upstream を都度解決する。
    # proxy_pass にホスト名を直接書くと nginx は起動時の IP を保持し続けるため、
    # backend-api を再作成すると 502 になる。変数経由にして再解決させる。
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
      set $upstream_api backend-api:8000;
      proxy_pass http://$upstream_api$request_uri;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # SSE / 長時間処理向け
      proxy_buffering off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
    }

    location = /openapi.json {
      set $upstream_openapi backend-api:8000;
      proxy_pass http://$upstream_openapi/openapi.json;
    }
    location = /docs {
      set $upstream_docs backend-api:8000;
      proxy_pass http://$upstream_docs/docs;
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache";
    }
  }
}

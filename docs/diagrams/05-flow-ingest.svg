25" font-size="15" font-weight="bold" fill="#7c4a03" text-anchor="middle" style="">queue</text><text x="608.75" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">RabbitMQ</text><line x1="836.25" y1="174" x2="836.25" y2="1304" stroke="#d98a1c" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="735.5" y="110" width="201.5" height="64" rx="10" fill="#fff1dc" stroke="#d98a1c" stroke-width="1.8"/><text x="836.25" y="138.25" font-size="15" font-weight="bold" fill="#7c4a03" text-anchor="middle" style="">ingest-worker</text><text x="836.25" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">×N</text><line x1="1063.75" y1="174" x2="1063.75" y2="1304" stroke="#c2418a" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="963.0" y="110" width="201.5" height="64" rx="10" fill="#fde7f3" stroke="#c2418a" stroke-width="1.8"/><text x="1063.75" y="138.25" font-size="15" font-weight="bold" fill="#831843" text-anchor="middle" style="">roi-service</text><text x="1063.75" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">U-Net</text><line x1="1291.25" y1="174" x2="1291.25" y2="1304" stroke="#c2418a" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1190.5" y="110" width="201.5" height="64" rx="10" fill="#fde7f3" stroke="#c2418a" stroke-width="1.8"/><text x="1291.25" y="138.25" font-size="15" font-weight="bold" fill="#831843" text-anchor="middle" style="">embedding-service</text><text x="1291.25" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">GPU</text><line x1="1518.75" y1="174" x2="1518.75" y2="1304" stroke="#6d55c9" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1418.0" y="110" width="201.5" height="64" rx="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="1518.75" y="138.25" font-size="15" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">metadata-db</text><text x="1518.75" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">PostgreSQL 17</text><line x1="1746.25" y1="174" x2="1746.25" y2="1304" stroke="#6d55c9" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1645.5" y="110" width="201.5" height="64" rx="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="1746.25" y="138.25" font-size="15" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">ベクトル用クラスタ</text><text x="1746.25" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">Citus + pgvector</text><line x1="30" y1="214" x2="1870" y2="214" stroke="#cbd5e1" stroke-width="1"/><rect x="40" y="201" width="114" height="26" rx="13" fill="#334155"/><text x="97.0" y="219" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle" style="">受付（同期）</text><path d="M157.75,284 L375.25,284" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="65.1" y="247" width="404.8" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="267.5" y="260" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">POST /api/v1/ingestions/validate</text><rect x="176.7" y="264" width="181.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="267.5" y="277" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">CSV と画像フォルダの指定</text><path d="M385.25,302 L415.25,302 L415.25,352 L387.25,352" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><text x="425.25" y="316" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">CSV と画像の突合</text><text x="425.25" y="333" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">（件数・欠損・重複）→ ingest_validation</text><path d="M377.25,381 L159.75,381" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" style="color:#374151"/><rect x="108.5" y="361" width="318.0" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="267.5" y="374" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">検証結果（validation_id・件数・警告）</text><path d="M157.75,414 L375.25,414" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="-127.10000000000002" y="394" width="789.2" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="267.5" y="407" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">POST /api/v1/ingestions（validation_id・重複時 SKIP・Idempotency-Key）</text><path d="M385.25,447 L1512.75,447" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="524.4" y="427" width="851.2" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="950.0" y="440" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">ingest_job・idempotency_key・ingest_item（1 枚 1 行）・outbox を 1 トランザクションで</text><path d="M385.25,480 L602.75,480" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="205.8" y="460" width="578.4" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="495.0" y="473" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">publish ingest.item（outbox 経由。失敗しても 30 秒ごとに再送）</text><path d="M377.25,513 L159.75,513" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" style="color:#374151"/><rect x="40.29999999999998" y="493" width="454.40000000000003" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="267.5" y="506" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">202 Accepted（job_id）→ 画面は進捗を polling</text><line x1="30" y1="533" x2="1870" y2="533" stroke="#cbd5e1" stroke-width="1"/><rect x="40" y="520" width="219" height="26" rx="13" fill="#334155"/><text x="149.5" y="538" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle" style="">1 枚ごとの処理（非同期）</text><path d="M612.75,586 L830.25,586" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="594.5" y="566" width="256.0" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="722.5" y="579" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">consume ingest.items</text><path d="M840.25,604 L870.25,604 L870.25,654 L842.25,654" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><text x="880.25" y="618" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">/imports/nihcc から画像を読み、形式を検査</text><text x="880.25" y="635" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">（ホストの NIHCC を読み取り専用でマウント）</text><path d="M840.25,700 L1512.75,700" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="801.5" y="663" width="752.0" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1177.5" y="676" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">patient（患者 ID はハッシュ）・source_image・image_binary・image_finding</text><rect x="1037.1" y="680" width="280.8" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1177.5" y="693" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">（登録済みで SKIP 指定ならここで終了）</text><path d="M840.25,733 L1057.75,733" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="784.8" y="713" width="330.40000000000003" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="950.0" y="726" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">POST /api/v1/roi/chest（画像）</text><path d="M1067.75,751 L1097.75,751 L1097.75,818 L1069.75,818" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><text x="1107.75" y="765" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">U-Net で肺・心臓 → 胸部野 mask</text><text x="1107.75" y="782" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">crop・pooling 入力（どちらも 518 px）</text><text x="1107.75" y="799" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">胸郭の形（16 次元）・品質判定</text><path d="M1059.75,847 L842.25,847" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" style="color:#374151"/><rect x="704.2" y="827" width="491.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="950.0" y="840" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">胸部野 mask・crop・pooling 画像と mask・胸郭の形・信頼度</text><path d="M840.25,897 L1285.25,897" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="879.95" y="860" width="367.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1063.75" y="873" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">POST /api/v1/embeddings/chest</text><rect x="892.35" y="877" width="342.8" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1063.75" y="890" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">（roi-service が作った入力をそのまま渡す）</text><path d="M1295.25,915 L1325.25,915 L1325.25,982 L1297.25,982" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><text x="1335.25" y="929" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">BiomedCLIP: crop → 512 次元</text><text x="1335.25" y="946" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">RAD-DINO → 胸部野で pooling → 分類器</text><text x="1335.25" y="963" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">→ 所見プロファイル 15 次元・14 確率</text><path d="M1287.25,1011 L842.25,1011" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" style="color:#374151"/><rect x="848.95" y="991" width="429.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1063.75" y="1004" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">vectors・fine_vectors・probabilities</text><path d="M840.25,1061 L1512.75,1061" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="776.7" y="1024" width="801.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1177.5" y="1037" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">model_version・chest_asset（mask・bbox・品質）・finding_estimate（14 確率）・</text><rect x="913.0999999999999" y="1041" width="528.8000000000001" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1177.5" y="1054" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">image_vector_state = PENDING を 1 トランザクションで</text><path d="M840.25,1111 L1740.25,1111" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="1076.45" y="1074" width="429.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1291.25" y="1087" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">image_embedding へ UPSERT（1 画像 1 行）</text><rect x="983.45" y="1091" width="615.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1291.25" y="1104" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">embedding 512・embedding_fine 15・embedding_lung 16</text><path d="M840.25,1144 L1512.75,1144" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="857.3" y="1124" width="640.4" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1177.5" y="1137" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">image_vector_state = STORED・ingest_item = SUCCEEDED</text><rect x="740.7" y="1158" width="1101.1" height="51.0" rx="6" fill="#fdecec" stroke="#e06666" stroke-width="1.2"/><text x="750.7" y="1180.5" font-size="12.5" font-weight="normal" fill="#8a1c1c" text-anchor="start" style="">失敗した場合: ingest_item に理由を残してジョブは続行（例: LUNG_TOO_SMALL = 肺野が小さすぎる → 手動確認へ）</text><text x="750.7" y="1199.0" font-size="12.5" font-weight="normal" fill="#8a1c1c" text-anchor="start" style="">ベクトル登録だけ失敗した場合は image_vector_state = FAILED を残し、reconcile.py で突合して補う</text><rect x="285.7" y="1223.0" width="646.0999999999999" height="51.0" rx="6" fill="#fff8db" stroke="#e2c044" stroke-width="1.2"/><text x="295.7" y="1245.5" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">起動時の照合: ingest-worker は roi-service の mask の作り方と分類器の前提、</text><text x="295.7" y="1264.0" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">ベクトル列の幅と .env の次元が一致するかを確かめ、違えば取り込みを始めない</text></svg>
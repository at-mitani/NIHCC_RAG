<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1213" viewBox="0 0 1900 1213" font-family="'Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="32" y="44" font-size="26" font-weight="bold" fill="#111827">処理フロー図（検索時）</text><text x="32" y="70" font-size="14" fill="#6b7280">画像だけの検索は所見プロファイルで全件を厳密に比べる（既定）。文章を含む検索は BiomedCLIP の HNSW（MULTIMODAL.md §4.1）</text><line x1="170.0" y1="174" x2="170.0" y2="1193" stroke="#6b7280" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="53.0" y="110" width="234.0" height="64" rx="10" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.8"/><text x="170.0" y="138.25" font-size="15" font-weight="bold" fill="#111827" text-anchor="middle" style="">利用者</text><text x="170.0" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">ブラウザ</text><line x1="430.0" y1="174" x2="430.0" y2="1193" stroke="#3b6fd8" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="313.0" y="110" width="234.0" height="64" rx="10" fill="#e0ecff" stroke="#3b6fd8" stroke-width="1.8"/><text x="430.0" y="138.25" font-size="15" font-weight="bold" fill="#1e3a8a" text-anchor="middle" style="">backend-api</text><text x="430.0" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">execute_search</text><line x1="690.0" y1="174" x2="690.0" y2="1193" stroke="#c2418a" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="573.0" y="110" width="234.0" height="64" rx="10" fill="#fde7f3" stroke="#c2418a" stroke-width="1.8"/><text x="690.0" y="138.25" font-size="15" font-weight="bold" fill="#831843" text-anchor="middle" style="">roi-service</text><text x="690.0" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">U-Net</text><line x1="950.0" y1="174" x2="950.0" y2="1193" stroke="#c2418a" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="833.0" y="110" width="234.0" height="64" rx="10" fill="#fde7f3" stroke="#c2418a" stroke-width="1.8"/><text x="950.0" y="138.25" font-size="15" font-weight="bold" fill="#831843" text-anchor="middle" style="">embedding-service</text><text x="950.0" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">GPU</text><line x1="1210.0" y1="174" x2="1210.0" y2="1193" stroke="#d98a1c" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1093.0" y="110" width="234.0" height="64" rx="10" fill="#fff1dc" stroke="#d98a1c" stroke-width="1.8"/><text x="1210.0" y="146.5" font-size="15" font-weight="bold" fill="#7c4a03" text-anchor="middle" style="">search-aggregator</text><line x1="1470.0" y1="174" x2="1470.0" y2="1193" stroke="#6d55c9" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1353.0" y="110" width="234.0" height="64" rx="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="1470.0" y="138.25" font-size="15" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">ベクトル用クラスタ</text><text x="1470.0" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">Citus + pgvector</text><line x1="1730.0" y1="174" x2="1730.0" y2="1193" stroke="#6d55c9" stroke-width="1.4" stroke-dasharray="5 5"/><rect x="1613.0" y="110" width="234.0" height="64" rx="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="1730.0" y="138.25" font-size="15" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">metadata-db</text><text x="1730.0" y="159.75" font-size="11.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">PostgreSQL 17</text><line x1="30" y1="214" x2="1870" y2="214" stroke="#cbd5e1" stroke-width="1"/><rect x="40" y="201" width="114" height="26" rx="13" fill="#334155"/><text x="97.0" y="219" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle" style="">要求と前処理</text><path d="M174.0,267 L424.0,267" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="35.599999999999966" y="247" width="528.8000000000001" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="300.0" y="260" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">POST /api/v1/searches（画像・文・モード・Top-K・絞り込み）</text><path d="M434.0,285 L464.0,285 L464.0,335 L436.0,335" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><text x="474.0" y="299" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">日本語の所見文 → 英語</text><text x="474.0" y="316" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">（承認済みのローカル辞書だけ。辞書に無ければ 422）</text><path d="M434.0,364 L684.0,364" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="376.2" y="344" width="367.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="560.0" y="357" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">POST /api/v1/roi/chest（検索元画像）</text><path d="M686.0,397 L436.0,397" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" style="color:#374151"/><rect x="351.4" y="377" width="417.2" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="560.0" y="390" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">胸部野 mask・crop・pooling 入力・胸郭の形・信頼度</text><path d="M434.0,430 L944.0,430" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="351.2" y="410" width="677.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="690.0" y="423" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">POST /api/v1/embeddings/chest（画像）・/embeddings/texts（文）</text><path d="M946.0,463 L436.0,463" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" style="color:#374151"/><rect x="425.59999999999997" y="443" width="528.8000000000001" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="690.0" y="456" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">BiomedCLIP 512・所見プロファイル 15（画像だけ）・検索元の所見の推定</text><path d="M434.0,481 L464.0,481 L464.0,531 L436.0,531" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><text x="474.0" y="495" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">進め方を決める（IMAGE_SEARCH_STRATEGY / 要求の strategy）</text><text x="474.0" y="512" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">画像だけ → profile（既定）か coarse_to_fine ／ 文章を含む・rerank=false → coarse_only</text><line x1="30" y1="547" x2="1870" y2="547" stroke="#cbd5e1" stroke-width="1"/><rect x="40" y="534" width="114" height="26" rx="13" fill="#334155"/><text x="97.0" y="552" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle" style="">ベクトル検索</text><path d="M434.0,600 L1204.0,600" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="487.4" y="580" width="665.2" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="820.0" y="593" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">POST /api/v1/vector/search（stage1 = fine | embedding）</text><rect x="1100.8" y="614" width="738.4000000000001" height="51.0" rx="6" fill="#fff8db" stroke="#e2c044" stroke-width="1.2"/><text x="1110.8" y="636.5" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">【画像だけ・既定】stage1 = fine: embedding_fine（15 次元）で全行を厳密に比較</text><text x="1110.8" y="655.0" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">  ORDER BY embedding_fine &lt;=&gt; q LIMIT k を 30 shard へ並列に押し下げ（索引なし・p95 24 ms）</text><path d="M1214.0,698.0 L1464.0,698.0" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="988.8" y="678.0" width="702.4" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1340.0" y="691.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">SELECT … ORDER BY embedding_fine &lt;=&gt; q LIMIT candidate_k</text><rect x="1100.8" y="712.0" width="738.4000000000001" height="51.0" rx="6" fill="#fff8db" stroke="#e2c044" stroke-width="1.2"/><text x="1110.8" y="734.5" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">【文章を含む】embedding（BiomedCLIP 512）の HNSW で上位 k 件（所見プロファイルは文章を扱えない）</text><text x="1110.8" y="753.0" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">【2 段検索（coarse_to_fine）】HNSW で candidate_k × 4 件 → embedding_fine で厳密に再スコア</text><path d="M1466.0,796.0 L1216.0,796.0" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" style="color:#374151"/><rect x="1162.4" y="776.0" width="355.2" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1340.0" y="789.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">image_id・距離（・roi_confidence）</text><path d="M1206.0,829.0 L436.0,829.0" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" style="color:#374151"/><rect x="419.2" y="809.0" width="801.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="820.0" y="822.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">候補・rerank_status（PROFILE_EXACT / APPLIED / DISABLED …）・timing_ms</text><path d="M434.0,862.0 L1204.0,862.0" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="537.0" y="842.0" width="566.0" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="820.0" y="855.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">POST /api/v1/vector/lung-shape（胸郭の形 16 次元。別欄）</text><path d="M1206.0,895.0 L436.0,895.0" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" style="color:#374151"/><rect x="760.2" y="875.0" width="119.60000000000001" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="820.0" y="888.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">胸郭の形が似た症例</text><line x1="30" y1="915.0" x2="1870" y2="915.0" stroke="#cbd5e1" stroke-width="1"/><rect x="40" y="902.0" width="129" height="26" rx="13" fill="#334155"/><text x="104.5" y="920.0" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle" style="">結果の組み立て</text><path d="M434.0,968.0 L1724.0,968.0" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="877.6" y="948.0" width="404.8" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1080.0" y="961.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">メタデータ・データセットのラベル・所見の推定・胸部野の品質を取得</text><path d="M434.0,986.0 L464.0,986.0 L464.0,1036.0 L436.0,1036.0" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><text x="474.0" y="1000.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">絞り込み（付随ラベル・撮影方向）・同一画像の除外</text><text x="474.0" y="1017.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="start" style="">検索元の信頼度が低ければ結果を抑制し警告</text><path d="M434.0,1065.0 L1724.0,1065.0" fill="none" stroke="#374151" stroke-width="1.8" marker-end="url(#arrow)" style="color:#374151"/><rect x="648.2" y="1045.0" width="863.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="1080.0" y="1058.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">search_query_chest・search_query_outline（検索元の輪郭。期限つき）・search_audit（監査）</text><path d="M426.0,1098.0 L176.0,1098.0" fill="none" stroke="#374151" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#arrow)" style="color:#374151"/><rect x="54.19999999999999" y="1078.0" width="491.6" height="17" rx="3" fill="#fff" fill-opacity="0.9"/><text x="300.0" y="1091.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">結果一覧（類似度・ラベル・所見の推定〈研究用・診断ではない〉・研究用途の警告）</text><rect x="60.8" y="1112.0" width="1778.4" height="51.0" rx="6" fill="#fdecec" stroke="#e06666" stroke-width="1.2"/><text x="70.8" y="1134.5" font-size="12.5" font-weight="normal" fill="#8a1c1c" text-anchor="start" style="">画面で非同期実行を選ぶと（Prefer: respond-async）: backend-api は 202 を返して search.requests へ投入</text><text x="70.8" y="1153.0" font-size="12.5" font-weight="normal" fill="#8a1c1c" text-anchor="start" style="">→ search-worker が同じ execute_search を実行して search_result へ書き込み、画面は search_id で polling する</text></svg>
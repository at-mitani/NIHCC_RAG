normal" fill="#c2418a" text-anchor="middle" style="">分散実行（SQL）</text><text x="42" y="925" font-size="16" font-weight="bold" fill="#111827" text-anchor="start" style="">読み方</text><text x="42" y="953" font-size="13.5" font-weight="normal" fill="#374151" text-anchor="start" style="">・「← X」は depends_on（X が起動・healthy になってから起動する）。:数字 はホストへ公開するポート。×N は INGEST_WORKER_REPLICAS</text><text x="42" y="977" font-size="13.5" font-weight="normal" fill="#374151" text-anchor="start" style="">・roi-service と embedding-service は app だけに居るので DB へ到達できない（胸部野と推論は DB を持たない）</text><text x="42" y="1001" font-size="13.5" font-weight="normal" fill="#374151" text-anchor="start" style="">・vector-worker は cluster-vector だけに居る。アプリから届くのは coordinator だけ</text><text x="42" y="1025" font-size="13.5" font-weight="normal" fill="#374151" text-anchor="start" style="">・評価のときだけ docker-compose.eval.yml で roi-service（:8001）・embedding-service（:8002）・metadata-db（:55432）を 127.0.0.1 に公開する</text><text x="42" y="1049" font-size="13.5" font-weight="normal" fill="#374151" text-anchor="start" style="">・アプリのコンテナ（frontend・backend-api・worker・aggregator・roi・embedding）は read_only: true（書けるのは /tmp の tmpfs）。永続するのは vol: の名前付き volume だけ</text><text x="42" y="1073" font-size="13.5" font-weight="normal" fill="#374151" text-anchor="start" style="">・bind（ro）はホストのファイルを読み取り専用で見せる: NIHCC = 画像とラベル CSV、infra/lung-unet = U-Net、infra/chest = 分類器</text><rect x="1700" y="925" width="22" height="16" rx="4" fill="#e0ecff" stroke="#3b6fd8" stroke-width="1.5"/><text x="1730" y="938" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start" style="">画面・API</text><rect x="1700" y="949" width="22" height="16" rx="4" fill="#fff1dc" stroke="#d98a1c" stroke-width="1.5"/><text x="1730" y="962" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start" style="">処理</text><rect x="1700" y="973" width="22" height="16" rx="4" fill="#fde7f3" stroke="#c2418a" stroke-width="1.5"/><text x="1730" y="986" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start" style="">AI 推論</text><rect x="1700" y="997" width="22" height="16" rx="4" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.5"/><text x="1730" y="1010" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start" style="">データ</text><rect x="1700" y="1021" width="22" height="16" rx="4" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/><text x="1730" y="1034" font-size="12.5" font-weight="normal" fill="#1f2937" text-anchor="start" style="">運用</text></svg>
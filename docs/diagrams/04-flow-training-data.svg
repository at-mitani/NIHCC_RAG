<svg xmlns="http://www.w3.org/2000/svg" width="1900" height="1260" viewBox="0 0 1900 1260" font-family="'Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="32" y="44" font-size="26" font-weight="bold" fill="#111827">処理フロー図（教師データ作成時）</text><text x="32" y="70" font-size="14" fill="#6b7280">EC2 で 1 回だけ行う。run_chest_eval.sh（chest_image_eval.py）→ export_chest_head.py（docs/runbooks/chest-classifier.md）</text><rect x="40" y="100" width="300" height="1140" rx="12" fill="#f5f5f4" fill-opacity="0.3" stroke="#8a8580" stroke-opacity="0.6"/><text x="190.0" y="128" font-size="15" font-weight="bold" fill="#3f3a36" text-anchor="middle" style="">入力データ</text><rect x="360" y="100" width="560" height="1140" rx="12" fill="#fffbe6" fill-opacity="0.3" stroke="#b59b2b" stroke-opacity="0.6"/><text x="640.0" y="128" font-size="15" font-weight="bold" fill="#5f4b00" text-anchor="middle" style="">ホストの評価スクリプト（venv・CPU 並列）</text><rect x="940" y="100" width="440" height="1140" rx="12" fill="#fde7f3" fill-opacity="0.3" stroke="#c2418a" stroke-opacity="0.6"/><text x="1160.0" y="128" font-size="15" font-weight="bold" fill="#831843" text-anchor="middle" style="">embedding-service（GPU・rad-dino・:8002 を公開）</text><rect x="1400" y="100" width="460" height="1140" rx="12" fill="#ece8fb" fill-opacity="0.3" stroke="#6d55c9" stroke-opacity="0.6"/><text x="1630.0" y="128" font-size="15" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">成果物（tmp/chest・infra/chest）</text><rect x="60" y="160" width="260" height="95" rx="10" fill="#f5f5f4" stroke="#8a8580" stroke-width="1.8"/><text x="190.0" y="195.0" font-size="16" font-weight="bold" fill="#3f3a36" text-anchor="middle" style="">胸部X線画像</text><text x="190.0" y="217.5" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">NIH ChestX-ray14</text><text x="190.0" y="235.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">112,120 枚（PNG）</text><rect x="60" y="300" width="260" height="95" rx="10" fill="#f5f5f4" stroke="#8a8580" stroke-width="1.8"/><text x="190.0" y="334.0" font-size="14" font-weight="bold" fill="#3f3a36" text-anchor="middle" style="">Data_Entry_2017_v2020.csv</text><text x="190.0" y="356.5" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">画像単位のラベル（NLP 由来）</text><text x="190.0" y="374.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">患者番号</text><rect x="60" y="440" width="260" height="95" rx="10" fill="#f5f5f4" stroke="#8a8580" stroke-width="1.8"/><text x="190.0" y="474.0" font-size="14" font-weight="bold" fill="#3f3a36" text-anchor="middle" style="">BBox_List_2017.csv</text><text x="190.0" y="496.5" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">正解 box（880 枚・984 個）</text><text x="190.0" y="514.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">被覆率の確認だけに使う</text><rect x="60" y="580" width="260" height="95" rx="10" fill="#f5f5f4" stroke="#8a8580" stroke-width="1.8"/><text x="190.0" y="615.0" font-size="16" font-weight="bold" fill="#3f3a36" text-anchor="middle" style="">U-Net（ONNX）</text><text x="190.0" y="637.5" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">infra/lung-unet/lung-unet.onnx</text><text x="190.0" y="655.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">profile nihcc-unet-local-v1</text><rect x="390" y="160" width="500" height="150" rx="10" fill="#fffbe6" stroke="#b59b2b" stroke-width="1.8"/><text x="640.0" y="205.5" font-size="15" font-weight="bold" fill="#5f4b00" text-anchor="middle" style="">① 胸部野の抽出（image_pipeline.chest）</text><text x="640.0" y="227.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">U-Net で右肺・左肺・心臓の mask</text><text x="640.0" y="244.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">胸部野 = 肺＋心臓の凸包 ＋ 下方へ肺の高さ 10% の帯</text><text x="640.0" y="261.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">＋ 周囲 2% の余白（縦隔・横隔膜を含める）</text><text x="640.0" y="278.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">肺野が小さすぎる画像は除外（54 枚）</text><path d="M320,207 L388,207" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" style="color:#4b5563"/><path d="M320,627 L350,627 L350,280 L388,280" fill="none" stroke="#8a8580" stroke-width="1.8" marker-end="url(#arrow)" style="color:#8a8580"/><rect x="390" y="350" width="500" height="105" rx="10" fill="#fffbe6" stroke="#b59b2b" stroke-width="1.8"/><text x="640.0" y="390.0" font-size="15" font-weight="bold" fill="#5f4b00" text-anchor="middle" style="">② モデル入力を作る</text><text x="640.0" y="412.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">pooling 用: 518 px 四方の画像と胸部野 mask</text><text x="640.0" y="429.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">（評価と本番で同じ関数。1 画素違うと確率がずれる）</text><path d="M640,310 L640,348" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" style="color:#4b5563"/><rect x="970" y="330" width="380" height="190" rx="10" fill="#fde7f3" stroke="#c2418a" stroke-width="1.8"/><text x="1160.0" y="387.0" font-size="15" font-weight="bold" fill="#831843" text-anchor="middle" style="">③ RAD-DINO の patch 特徴</text><text x="1160.0" y="409.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">/api/v1/embeddings/region-pool</text><text x="1160.0" y="426.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">ViT-B/14・518 px → 37×37 の patch</text><text x="1160.0" y="443.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">胸部野 mask の被覆率で重み付け平均</text><text x="1160.0" y="460.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">→ 768 次元（pool-chest）</text><text x="1160.0" y="477.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">対照: pool-lung・pool-whole・crop-chest</text><path d="M890,400 L968,400" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" style="color:#4b5563"/><rect x="901.25" y="381.5" width="55.5" height="17.5" rx="4" fill="#ffffff" fill-opacity="0.88"/><text x="929.0" y="394.0" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle" style="">HTTP</text><path d="M1440,360 a190.0,10 0 0,0 380,0 v100 a190.0,10 0 0,1 -380,0 z" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><ellipse cx="1630.0" cy="360" rx="190.0" ry="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="1630.0" y="402.5" font-size="15" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">特徴のキャッシュ</text><text x="1630.0" y="424.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">vec_pool-chest_*.npz・shards/</text><text x="1630.0" y="441.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">2,000 枚ごとに保存・途中から再開</text><path d="M1350,425 L1438,425" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" style="color:#4b5563"/><rect x="390" y="500" width="500" height="95" rx="10" fill="#fffbe6" stroke="#b59b2b" stroke-width="1.8"/><text x="640.0" y="535.0" font-size="15" font-weight="bold" fill="#5f4b00" text-anchor="middle" style="">④ 被覆率（coverage）</text><text x="640.0" y="557.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">正解 box が胸部野へ 50% 以上入る割合</text><text x="640.0" y="574.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">胸部野 99.7% ／ 肺野だけ 58.7%</text><path d="M320,487 L388,540" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" style="color:#4b5563"/><rect x="1440" y="510" width="380" height="70" rx="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="1630.0" y="540.25" font-size="14" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">coverage.json</text><text x="1630.0" y="562.75" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">枠が所見を含むかの判定材料</text><path d="M890,547 L1438,547" fill="none" stroke="#8a8580" stroke-width="1.8" marker-end="url(#arrow)" style="color:#8a8580"/><rect x="390" y="640" width="500" height="140" rx="10" fill="#fffbe6" stroke="#b59b2b" stroke-width="1.8"/><text x="640.0" y="680.5" font-size="15" font-weight="bold" fill="#5f4b00" text-anchor="middle" style="">⑤ 教師データ（teacher）</text><text x="640.0" y="702.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">画像単位の 14 所見ラベル（多ラベル）</text><text x="640.0" y="719.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">患者単位で分割（同じ患者を跨がせない）</text><text x="640.0" y="736.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">train 77,648 / val 11,435 / test 22,983 枚</text><text x="640.0" y="753.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">112,066 枚（99.95%）で作成</text><path d="M320,347 L340,347 L340,700 L388,700" fill="none" stroke="#8a8580" stroke-width="1.8" marker-end="url(#arrow)" style="color:#8a8580"/><path d="M1440,650 a190.0,10 0 0,0 380,0 v90 a190.0,10 0 0,1 -380,0 z" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><ellipse cx="1630.0" cy="650" rx="190.0" ry="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="1630.0" y="696.0" font-size="15" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">ec2-full/teacher_*.npz</text><text x="1630.0" y="718.0" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">画像名・14 所見・split（git で追跡）</text><path d="M890,700 L1438,700" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" style="color:#4b5563"/><rect x="390" y="820" width="500" height="150" rx="10" fill="#fffbe6" stroke="#b59b2b" stroke-width="1.8"/><text x="640.0" y="865.5" font-size="15" font-weight="bold" fill="#5f4b00" text-anchor="middle" style="">⑥ 分類器の学習（ChestHead）</text><text x="640.0" y="887.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">標準化 → 線形（768 × 14）→ sigmoid</text><text x="640.0" y="904.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">train で学習・val で epoch を選ぶ</text><text x="640.0" y="921.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">所見プロファイル = 14 確率 ＋ 正常らしさ</text><text x="640.0" y="938.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">→ L2 正規化（15 次元）</text><path d="M640,780 L640,818" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" style="color:#4b5563"/><path d="M1440,455 L1393,455 L1393,838 L892,838" fill="none" stroke="#6d55c9" stroke-width="1.8" marker-end="url(#arrow)" style="color:#6d55c9"/><rect x="1044.5124999999998" y="819.5" width="67.375" height="17.5" rx="4" fill="#ffffff" fill-opacity="0.88"/><text x="1078.1999999999998" y="832.0" font-size="12.5" font-weight="normal" fill="#6d55c9" text-anchor="middle" style="">特徴を読む</text><rect x="390" y="1010" width="500" height="150" rx="10" fill="#fff7d6" stroke="#c99a06" stroke-width="1.8"/><text x="640.0" y="1055.5" font-size="15" font-weight="bold" fill="#6b4f00" text-anchor="middle" style="">⑦ 評価（test の患者だけ）</text><text x="640.0" y="1077.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">画像単位 AUC 0.833 [0.824, 0.839]</text><text x="640.0" y="1094.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">帰無（画像統計量）0.696 を上回る</text><text x="640.0" y="1111.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">Test B: 上位 20 件の lift が 14 所見すべて ≥ 1.33</text><text x="640.0" y="1128.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="middle" style="">所見別 AUC 0.70（浸潤影）〜0.905（心拡大）</text><path d="M640,970 L640,1008" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" style="color:#4b5563"/><rect x="1440" y="820" width="380" height="100" rx="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="1630.0" y="856.5" font-size="14" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">head_pool-chest_*.npz</text><text x="1630.0" y="879.0" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">学習した分類器</text><text x="1630.0" y="896.5" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">train.json（AUC・Test B）</text><path d="M890,870 L1438,870" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" style="color:#4b5563"/><rect x="970" y="1010" width="380" height="200" rx="10" fill="#fffbe6" stroke="#b59b2b" stroke-width="1.8"/><text x="982" y="1063.5" font-size="15" font-weight="bold" fill="#5f4b00" text-anchor="start" style="">⑧ 本番用に書き出す</text><text x="982" y="1085.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start" style="">export_chest_head.py</text><text x="982" y="1102.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start" style="">特徴の作り方を一緒に記録:</text><text x="982" y="1119.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start" style="">  RAD-DINO の版（revision 固定）</text><text x="982" y="1136.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start" style="">  pooling 518 px・mask 10% / 2%</text><text x="982" y="1153.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start" style="">  U-Net の profile</text><text x="982" y="1170.5" font-size="12" font-weight="normal" fill="#374151" text-anchor="start" style="">未固定（unpinned）は書き出せない</text><path d="M890,1085 L968,1085" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" style="color:#4b5563"/><rect x="895.3125" y="1064.5" width="67.375" height="17.5" rx="4" fill="#ffffff" fill-opacity="0.88"/><text x="929.0" y="1077.0" font-size="12.5" font-weight="normal" fill="#4b5563" text-anchor="middle" style="">合格したら</text><rect x="1440" y="1000" width="380" height="110" rx="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="1630.0" y="1050.25" font-size="14" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">infra/chest/head-pool-chest.npz</text><text x="1630.0" y="1072.75" font-size="12.5" font-weight="normal" fill="#374151" text-anchor="middle" style="">本番の分類器（git には入れない）</text><path d="M1350,1055 L1438,1055" fill="none" stroke="#4b5563" stroke-width="1.8" marker-end="url(#arrow)" style="color:#4b5563"/><rect x="1440" y="1130" width="380" height="69.5" rx="6" fill="#fff8db" stroke="#e2c044" stroke-width="1.2"/><text x="1450" y="1152.5" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">→ embedding-service（chest-profile）が起動時に読み、</text><text x="1450" y="1171.0" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">  backbone の版・解像度を照合。ingest-worker は</text><text x="1450" y="1189.5" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">  mask の作り方・profile を照合（違えば止まる）</text><rect x="60" y="720" width="270" height="88.0" rx="6" fill="#fff8db" stroke="#e2c044" stroke-width="1.2"/><text x="70" y="742.5" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">教師は「画像単位のラベル」</text><text x="70" y="761.0" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">そのもの。部位単位の正解は</text><text x="70" y="779.5" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">無いので、検索の単位も画像</text><text x="70" y="798.0" font-size="12.5" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">1 枚の胸部野にしている</text></svg>
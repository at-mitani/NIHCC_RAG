<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="905" viewBox="0 0 1700 905" font-family="'Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="32" y="56" font-size="38" font-weight="bold" fill="#111827">肺野の抽出（ROI）</text><text x="32" y="90" font-size="22" fill="#6b7280">U-Net で肺と心臓を切り出し、胸部野（肺野＋縦隔＋横隔膜）を作る</text><rect x="30" y="120" width="700" height="92" rx="10" fill="#fde7f3" stroke="#c2418a" stroke-width="1.8"/><text x="380.0" y="163.5" font-size="27" font-weight="bold" fill="#831843" text-anchor="middle" style="">① U-Net で分割</text><text x="380.0" y="194.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">右肺・左肺・心臓（160 px）</text><path d="M380.0,214 L380.0,237" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="240" width="700" height="92" rx="10" fill="#ddf4ee" stroke="#1f9e7a" stroke-width="1.8"/><text x="380.0" y="283.5" font-size="27" font-weight="bold" fill="#065f46" text-anchor="middle" style="">② 二値化</text><text x="380.0" y="314.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">確率で拡大 → 閾値 0.5</text><path d="M380.0,334 L380.0,357" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="360" width="700" height="92" rx="10" fill="#ddf4ee" stroke="#1f9e7a" stroke-width="1.8"/><text x="380.0" y="403.5" font-size="27" font-weight="bold" fill="#065f46" text-anchor="middle" style="">③ 最大の塊だけ残す</text><text x="380.0" y="434.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">離れた誤検出を消す</text><path d="M380.0,454 L380.0,477" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="480" width="700" height="92" rx="10" fill="#fff7d6" stroke="#c99a06" stroke-width="1.8"/><text x="380.0" y="523.5" font-size="27" font-weight="bold" fill="#6b4f00" text-anchor="middle" style="">④ 品質の判定</text><text x="380.0" y="554.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">肺野が 2% 未満なら却下</text><path d="M380.0,574 L380.0,597" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="600" width="700" height="92" rx="10" fill="#ddf4ee" stroke="#1f9e7a" stroke-width="1.8"/><text x="380.0" y="643.5" font-size="27" font-weight="bold" fill="#065f46" text-anchor="middle" style="">⑤ 胸部野 mask</text><text x="380.0" y="674.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">凸包 → 下 10% → 全周 2%</text><path d="M380.0,694 L380.0,717" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="720" width="700" height="92" rx="10" fill="#e0ecff" stroke="#3b6fd8" stroke-width="1.8"/><text x="380.0" y="763.5" font-size="27" font-weight="bold" fill="#1e3a8a" text-anchor="middle" style="">⑥ モデルへの入力</text><text x="380.0" y="794.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">518 px の画像＋mask・crop</text><rect x="780" y="120" width="890" height="130" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="1225.0" y="168.5" font-size="25" font-weight="bold" fill="#334155" text-anchor="middle" style="">規則ベースとの比較</text><text x="1225.0" y="199.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">規則ベースは頸部・肩・腹部を掴むことがある</text><text x="1225.0" y="225.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">破綻 23.8% → U-Net で 0.5%</text><rect x="780" y="275" width="890" height="130" rx="10" fill="#fff7d6" stroke="#c99a06" stroke-width="1.8"/><text x="1225.0" y="323.5" font-size="25" font-weight="bold" fill="#6b4f00" text-anchor="middle" style="">判定の結果</text><text x="1225.0" y="354.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">肺野 2% 未満 → 却下（手動確認へ）</text><text x="1225.0" y="380.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">片肺なし・左右差 → 続行（信頼度 0.5）</text><path d="M730,526 L752,526 L752,340 L778,340" fill="none" stroke="#c0392b" stroke-width="3" marker-end="url(#arrow)" style="color:#c0392b"/><rect x="780" y="430" width="890" height="382" rx="14" fill="#fffaf2" stroke="#d27a0a" stroke-width="1.6"/><text x="794" y="452" font-size="24" font-weight="bold" fill="#d27a0a" text-anchor="start" style="">胸部野 mask の作り方</text><g transform="translate(795,515) scale(1.08)"><ellipse cx="52" cy="96" rx="25" ry="60" fill="#7aa7e8" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="136" cy="96" rx="24" ry="58" fill="#7aa7e8" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="100" cy="142" rx="28" ry="22" fill="#f19ab0" stroke="#c2418a" stroke-width="2"/></g><text x="897" y="778" font-size="22" font-weight="bold" fill="#7c4a03" text-anchor="middle" style="">肺・心臓</text><text x="1007" y="630" font-size="30" font-weight="normal" fill="#9ca3af" text-anchor="middle" style="">→</text><g transform="translate(1017,515) scale(1.08)"><polygon points="22,98 28,46 52,30 136,30 160,46 166,98 162,150 140,168 100,170 46,168 26,150" fill="#fde7c8" stroke="#d27a0a" stroke-width="2.5"/><ellipse cx="52" cy="96" rx="25" ry="60" fill="#7aa7e8" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="136" cy="96" rx="24" ry="58" fill="#7aa7e8" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="100" cy="142" rx="28" ry="22" fill="#f19ab0" stroke="#c2418a" stroke-width="2"/></g><text x="1119" y="778" font-size="22" font-weight="bold" fill="#7c4a03" text-anchor="middle" style="">凸包</text><text x="1229" y="630" font-size="30" font-weight="normal" fill="#9ca3af" text-anchor="middle" style="">→</text><g transform="translate(1239,515) scale(1.08)"><polygon points="22,98 28,46 52,30 136,30 160,46 166,98 162,170 140,188 100,190 46,188 26,170" fill="#fde7c8" stroke="#d27a0a" stroke-width="2.5"/><ellipse cx="52" cy="96" rx="25" ry="60" fill="#7aa7e8" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="136" cy="96" rx="24" ry="58" fill="#7aa7e8" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="100" cy="142" rx="28" ry="22" fill="#f19ab0" stroke="#c2418a" stroke-width="2"/></g><text x="1341" y="778" font-size="22" font-weight="bold" fill="#7c4a03" text-anchor="middle" style="">下へ 10%</text><text x="1451" y="630" font-size="30" font-weight="normal" fill="#9ca3af" text-anchor="middle" style="">→</text><g transform="translate(1461,515) scale(1.08)"><polygon points="22,98 28,46 52,30 136,30 160,46 166,98 162,170 140,188 100,190 46,188 26,170" fill="#fde7c8" stroke="#f0a64a" stroke-width="16" stroke-linejoin="round"/><polygon points="22,98 28,46 52,30 136,30 160,46 166,98 162,170 140,188 100,190 46,188 26,170" fill="#fde7c8" stroke="#d27a0a" stroke-width="2.5"/><ellipse cx="52" cy="96" rx="25" ry="60" fill="#7aa7e8" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="136" cy="96" rx="24" ry="58" fill="#7aa7e8" stroke="#2f6fdb" stroke-width="2"/><ellipse cx="100" cy="142" rx="28" ry="22" fill="#f19ab0" stroke="#c2418a" stroke-width="2"/></g><text x="1563" y="778" font-size="22" font-weight="bold" fill="#7c4a03" text-anchor="middle" style="">全周 2%</text><path d="M730,646 L778,646" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="840" width="1640" height="42" rx="6" fill="#fff8db" stroke="#e2c044" stroke-width="1.2"/><text x="40" y="872" font-size="22" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">縦隔・心臓（心拡大）と横隔膜（胸水）を枠に入れる。脊柱は縦隔と重なるので除けない</text></svg>
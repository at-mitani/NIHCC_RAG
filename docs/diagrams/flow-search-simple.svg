<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="990" viewBox="0 0 1700 990" font-family="'Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="32" y="56" font-size="38" font-weight="bold" fill="#111827">画像検索と結果表示</text><text x="32" y="90" font-size="22" fill="#6b7280">検索元に似た症例を探し、所見の推定と一緒に表示する</text><rect x="30" y="120" width="700" height="88" rx="10" fill="#e0ecff" stroke="#3b6fd8" stroke-width="1.8"/><text x="380.0" y="161.5" font-size="27" font-weight="bold" fill="#1e3a8a" text-anchor="middle" style="">① 検索条件を入力</text><text x="380.0" y="192.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">画像・文・件数・絞り込み</text><path d="M380.0,210 L380.0,231" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="234" width="700" height="88" rx="10" fill="#e0ecff" stroke="#3b6fd8" stroke-width="1.8"/><text x="380.0" y="275.5" font-size="27" font-weight="bold" fill="#1e3a8a" text-anchor="middle" style="">② 文を英語に</text><text x="380.0" y="306.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">承認済みの辞書だけ（外部 API なし）</text><path d="M380.0,324 L380.0,345" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="348" width="700" height="88" rx="10" fill="#fde7f3" stroke="#c2418a" stroke-width="1.8"/><text x="380.0" y="389.5" font-size="27" font-weight="bold" fill="#831843" text-anchor="middle" style="">③ 胸部野の抽出</text><text x="380.0" y="420.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">検索元画像を roi-service へ</text><path d="M380.0,438 L380.0,459" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="462" width="700" height="88" rx="10" fill="#fde7f3" stroke="#c2418a" stroke-width="1.8"/><text x="380.0" y="503.5" font-size="27" font-weight="bold" fill="#831843" text-anchor="middle" style="">④ ベクトル化</text><text x="380.0" y="534.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">BiomedCLIP・所見プロファイル</text><path d="M380.0,552 L380.0,573" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="576" width="700" height="88" rx="10" fill="#fff1dc" stroke="#d98a1c" stroke-width="1.8"/><text x="380.0" y="617.5" font-size="27" font-weight="bold" fill="#7c4a03" text-anchor="middle" style="">⑤ ベクトル検索</text><text x="380.0" y="648.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">画像: 全件比較 ／ 文: 2 段検索</text><path d="M380.0,666 L380.0,687" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="690" width="700" height="88" rx="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="380.0" y="731.5" font-size="27" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">⑥ 結果を組み立てる</text><text x="380.0" y="762.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">ラベル・所見の推定・絞り込み</text><path d="M380.0,780 L380.0,801" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="804" width="700" height="88" rx="10" fill="#e0ecff" stroke="#3b6fd8" stroke-width="1.8"/><text x="380.0" y="845.5" font-size="27" font-weight="bold" fill="#1e3a8a" text-anchor="middle" style="">⑦ 画面に表示</text><text x="380.0" y="876.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">似た症例＋胸郭の形が似た症例</text><rect x="780" y="150" width="890" height="196" rx="10" fill="#fff7d6" stroke="#c99a06" stroke-width="1.8"/><text x="1225.0" y="218.5" font-size="25" font-weight="bold" fill="#6b4f00" text-anchor="middle" style="">検索元の扱い</text><text x="1225.0" y="249.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">辞書に無い自由文は翻訳しない</text><text x="1225.0" y="275.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">胸部野の信頼度が低いと結果を抑制</text><text x="1225.0" y="301.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">検索元画像は 60 分で削除</text><path d="M730,278 L778,278" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="780" y="378" width="890" height="204" rx="10" fill="#fff1dc" stroke="#d98a1c" stroke-width="1.8"/><text x="792" y="450.5" font-size="25" font-weight="bold" fill="#7c4a03" text-anchor="start" style="">⑤ の進め方</text><text x="792" y="481.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="start" style="">画像だけ → 所見プロファイルで</text><text x="792" y="507.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="start" style="">　全画像と厳密に比較（p95 24 ms）</text><text x="792" y="533.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="start" style="">文を含む → BiomedCLIP で候補 → 並べ替え</text><path d="M730,620 L754,620 L754,480 L778,480" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="780" y="610" width="890" height="282" rx="12" fill="#ffffff" stroke="#3b6fd8" stroke-width="2"/><text x="800" y="642" font-size="19" font-weight="bold" fill="#3b6fd8" text-anchor="start" style="">結果カード（見本）</text><rect x="800" y="660" width="190" height="212" rx="8" fill="#374151"/><path d="M828,690 C840,668 950,668 962,690 L968,820 C940,850 850,850 822,820 Z" fill="none" stroke="#f59e0b" stroke-width="3"/><ellipse cx="866" cy="760" rx="26" ry="62" fill="#9ca3af" fill-opacity="0.7"/><ellipse cx="926" cy="760" rx="25" ry="60" fill="#9ca3af" fill-opacity="0.7"/><text x="1015" y="690" font-size="24" font-weight="bold" fill="#111827" text-anchor="start" style="">#1　類似度 0.968</text><rect x="1015" y="706" width="241" height="31" rx="15.5" fill="#2f6fdb" fill-opacity="0.13" stroke="#2f6fdb" stroke-width="1.5"/><text x="1135.29" y="725" font-size="17" font-weight="bold" fill="#2f6fdb" text-anchor="middle" style="">所見プロファイルで全件検索</text><text x="1015" y="778" font-size="20" font-weight="normal" fill="#374151" text-anchor="start" style="">データセットのラベル: 結節影</text><text x="1015" y="816" font-size="18" font-weight="normal" fill="#6b7280" text-anchor="start" style="">所見の推定（研究用・診断ではない）</text><rect x="1015" y="830" width="147" height="32" rx="16.0" fill="#c2418a" fill-opacity="0.13" stroke="#c2418a" stroke-width="1.5"/><text x="1088.74" y="850" font-size="18" font-weight="bold" fill="#c2418a" text-anchor="middle" style="">結節 0.71</text><rect x="1172.48" y="830" width="147" height="32" rx="16.0" fill="#c2418a" fill-opacity="0.13" stroke="#c2418a" stroke-width="1.5"/><text x="1246.22" y="850" font-size="18" font-weight="bold" fill="#c2418a" text-anchor="middle" style="">腫瘤 0.42</text><rect x="1329.96" y="830" width="165" height="32" rx="16.0" fill="#c2418a" fill-opacity="0.13" stroke="#c2418a" stroke-width="1.5"/><text x="1412.52" y="850" font-size="18" font-weight="bold" fill="#c2418a" text-anchor="middle" style="">浸潤影 0.30</text><path d="M730,848 L778,848" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="920" width="1640" height="42" rx="6" fill="#fff8db" stroke="#e2c044" stroke-width="1.2"/><text x="40" y="952" font-size="22" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">2 秒を超えそうなら非同期: search-worker が処理し、画面は結果を待って表示</text></svg>
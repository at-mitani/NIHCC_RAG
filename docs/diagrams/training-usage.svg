<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1000" viewBox="0 0 1800 1000" font-family="'Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="32" y="56" font-size="38" font-weight="bold" fill="#111827">教師データの利用</text><text x="32" y="90" font-size="22" fill="#6b7280">分類器を学習・評価し、合格したら本番で使う</text><rect x="30" y="110" width="1740" height="400" rx="14" fill="#f8fafc" stroke="#475569" stroke-width="1.6"/><text x="44" y="132" font-size="22" font-weight="bold" fill="#475569" text-anchor="start" style="">学習と評価（EC2 で 1 回）</text><rect x="50" y="220" width="260" height="180" rx="10" fill="#e0ecff" stroke="#3b6fd8" stroke-width="1.8"/><text x="180.0" y="307.5" font-size="27" font-weight="bold" fill="#1e3a8a" text-anchor="middle" style="">教師データ</text><text x="180.0" y="338.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">特徴＋ラベル</text><rect x="370" y="160" width="200" height="90" rx="10" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"/><text x="470" y="214" font-size="24" font-weight="bold" fill="#2f6fdb" text-anchor="middle" style="">train 70%</text><path d="M310,310 L340,310 L340,205 L368,205" fill="none" stroke="#2f6fdb" stroke-width="2.6" marker-end="url(#arrow)" style="color:#2f6fdb"/><rect x="620" y="160" width="640" height="90" rx="10" fill="#ddf4ee" stroke="#1f9e7a" stroke-width="1.8"/><text x="940.0" y="201.5" font-size="25" font-weight="bold" fill="#065f46" text-anchor="middle" style="">分類器を学習</text><text x="940.0" y="232.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">線形 × 14 所見（稀な所見に重み）</text><path d="M570,205 L618,205" fill="none" stroke="#2f6fdb" stroke-width="3" marker-end="url(#arrow)" style="color:#2f6fdb"/><rect x="370" y="280" width="200" height="90" rx="10" fill="#d27a0a" fill-opacity="0.12" stroke="#d27a0a" stroke-width="2"/><text x="470" y="334" font-size="24" font-weight="bold" fill="#d27a0a" text-anchor="middle" style="">val 10%</text><path d="M310,310 L340,310 L340,325 L368,325" fill="none" stroke="#d27a0a" stroke-width="2.6" marker-end="url(#arrow)" style="color:#d27a0a"/><rect x="620" y="280" width="640" height="90" rx="10" fill="#ddf4ee" stroke="#1f9e7a" stroke-width="1.8"/><text x="940.0" y="321.5" font-size="25" font-weight="bold" fill="#065f46" text-anchor="middle" style="">止め時を決める</text><text x="940.0" y="352.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">平均 AUC が最大の回を採用</text><path d="M570,325 L618,325" fill="none" stroke="#d27a0a" stroke-width="3" marker-end="url(#arrow)" style="color:#d27a0a"/><rect x="370" y="400" width="200" height="90" rx="10" fill="#7c3aed" fill-opacity="0.12" stroke="#7c3aed" stroke-width="2"/><text x="470" y="454" font-size="24" font-weight="bold" fill="#7c3aed" text-anchor="middle" style="">test 20%</text><path d="M310,310 L340,310 L340,445 L368,445" fill="none" stroke="#7c3aed" stroke-width="2.6" marker-end="url(#arrow)" style="color:#7c3aed"/><rect x="620" y="400" width="640" height="90" rx="10" fill="#fff7d6" stroke="#c99a06" stroke-width="1.8"/><text x="940.0" y="441.5" font-size="25" font-weight="bold" fill="#6b4f00" text-anchor="middle" style="">評価</text><text x="940.0" y="472.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">AUC 0.833・検索 lift ≥ 1.33</text><path d="M570,445 L618,445" fill="none" stroke="#7c3aed" stroke-width="3" marker-end="url(#arrow)" style="color:#7c3aed"/><rect x="1320" y="220" width="430" height="180" rx="10" fill="#f5f5f4" stroke="#8a8580" stroke-width="1.8"/><text x="1535.0" y="294.5" font-size="27" font-weight="bold" fill="#3f3a36" text-anchor="middle" style="">分類器</text><text x="1535.0" y="325.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">head-pool-chest.npz</text><text x="1535.0" y="351.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">（合格したら配置）</text><path d="M1260,205 L1290,205 L1290,290 L1318,290" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><path d="M1260,445 L1290,445 L1290,330 L1318,330" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="545" width="1740" height="370" rx="14" fill="#fff7fb" stroke="#c2418a" stroke-width="1.6"/><text x="44" y="567" font-size="22" font-weight="bold" fill="#c2418a" text-anchor="start" style="">本番での利用（取り込み・検索のたび）</text><rect x="560" y="590" width="680" height="100" rx="10" fill="#fde7f3" stroke="#c2418a" stroke-width="1.8"/><text x="900.0" y="637.5" font-size="27" font-weight="bold" fill="#831843" text-anchor="middle" style="">embedding-service（GPU）</text><text x="900.0" y="668.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">画像の特徴 → 分類器 → 14 所見の確率</text><path d="M1535,400 L1535,640 L1242,640" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="50" y="745" width="560" height="140" rx="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="330.0" y="799.0" font-size="26" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">所見プロファイル</text><text x="330.0" y="830.0" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">14 確率＋正常らしさ（15 次元）</text><text x="330.0" y="856.0" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">→ 似た画像を全件から探す</text><path d="M900,690 L900,715 L330,715 L330,743" fill="none" stroke="#c2418a" stroke-width="2.6" marker-end="url(#arrow)" style="color:#c2418a"/><rect x="620" y="745" width="560" height="140" rx="10" fill="#e0ecff" stroke="#3b6fd8" stroke-width="1.8"/><text x="900.0" y="799.0" font-size="26" font-weight="bold" fill="#1e3a8a" text-anchor="middle" style="">所見の推定</text><text x="900.0" y="830.0" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">上位 3 件を画面に表示</text><text x="900.0" y="856.0" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">研究用・診断ではない</text><path d="M900,690 L900,715 L900,715 L900,743" fill="none" stroke="#c2418a" stroke-width="2.6" marker-end="url(#arrow)" style="color:#c2418a"/><rect x="1190" y="745" width="560" height="140" rx="10" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.8"/><text x="1470.0" y="799.0" font-size="26" font-weight="bold" fill="#334155" text-anchor="middle" style="">病変の位置（評価用）</text><text x="1470.0" y="830.0" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">確率を区画ごとに分解（chest-map）</text><text x="1470.0" y="856.0" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">位置を示したのは腫瘤だけ</text><path d="M900,690 L900,715 L1470,715 L1470,743" fill="none" stroke="#c2418a" stroke-width="2.6" marker-end="url(#arrow)" style="color:#c2418a"/><rect x="30" y="935" width="1740" height="42" rx="6" fill="#fff8db" stroke="#e2c044" stroke-width="1.2"/><text x="40" y="967" font-size="22" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">教師データ自体は本番の DB に入れない。本番に置くのは学習した分類器だけ</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="905" viewBox="0 0 1700 905" font-family="'Yu Gothic UI','Yu Gothic','Meiryo','Noto Sans JP',sans-serif"><rect width="100%" height="100%" fill="#ffffff"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker><marker id="arrow-start" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/></marker></defs><text x="32" y="56" font-size="38" font-weight="bold" fill="#111827">画像データの取り込み</text><text x="32" y="90" font-size="22" fill="#6b7280">画像とラベルを登録し、検索できる状態にする</text><rect x="30" y="120" width="700" height="92" rx="10" fill="#e0ecff" stroke="#3b6fd8" stroke-width="1.8"/><text x="380.0" y="163.5" font-size="27" font-weight="bold" fill="#1e3a8a" text-anchor="middle" style="">① 画面で指定</text><text x="380.0" y="194.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">画像フォルダとラベル CSV</text><path d="M380.0,214 L380.0,237" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="240" width="700" height="92" rx="10" fill="#e0ecff" stroke="#3b6fd8" stroke-width="1.8"/><text x="380.0" y="283.5" font-size="27" font-weight="bold" fill="#1e3a8a" text-anchor="middle" style="">② 検証</text><text x="380.0" y="314.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">CSV と画像を突き合わせる</text><path d="M380.0,334 L380.0,357" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="360" width="700" height="92" rx="10" fill="#fff1dc" stroke="#d98a1c" stroke-width="1.8"/><text x="380.0" y="403.5" font-size="27" font-weight="bold" fill="#7c4a03" text-anchor="middle" style="">③ ジョブ登録</text><text x="380.0" y="434.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">1 枚 = 1 件をキューへ</text><path d="M380.0,454 L380.0,477" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="480" width="700" height="92" rx="10" fill="#fde7f3" stroke="#c2418a" stroke-width="1.8"/><text x="380.0" y="523.5" font-size="27" font-weight="bold" fill="#831843" text-anchor="middle" style="">④ 胸部野の抽出</text><text x="380.0" y="554.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">roi-service（U-Net）</text><path d="M380.0,574 L380.0,597" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="600" width="700" height="92" rx="10" fill="#fde7f3" stroke="#c2418a" stroke-width="1.8"/><text x="380.0" y="643.5" font-size="27" font-weight="bold" fill="#831843" text-anchor="middle" style="">⑤ ベクトル化</text><text x="380.0" y="674.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">BiomedCLIP・所見プロファイル</text><path d="M380.0,694 L380.0,717" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="720" width="700" height="92" rx="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="380.0" y="763.5" font-size="27" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">⑥ 登録</text><text x="380.0" y="794.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">メタデータ・ベクトル・所見の推定</text><rect x="780" y="206" width="890" height="160" rx="10" fill="#e0ecff" stroke="#3b6fd8" stroke-width="1.8"/><text x="1225.0" y="269.5" font-size="25" font-weight="bold" fill="#1e3a8a" text-anchor="middle" style="">受付で確かめる</text><text x="1225.0" y="300.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">件数・欠損・重複を先に表示</text><text x="1225.0" y="326.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">同じ画像の再送は二重に入らない</text><path d="M730,286 L778,286" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="780" y="390" width="890" height="186" rx="10" fill="#fff1dc" stroke="#d98a1c" stroke-width="1.8"/><text x="1225.0" y="453.5" font-size="25" font-weight="bold" fill="#7c4a03" text-anchor="middle" style="">1 枚ずつ処理（非同期）</text><text x="1225.0" y="484.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">複数の ingest-worker が並行して処理</text><text x="1225.0" y="510.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">失敗しても止めない（理由を記録）</text><text x="1225.0" y="536.5" font-size="21" font-weight="normal" fill="#374151" text-anchor="middle" style="">肺野が小さい画像 → 手動確認へ</text><path d="M730,406 L778,406" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="780" y="600" width="890" height="212" rx="10" fill="#f6f4fe" stroke="#d6cdf5"/><path d="M805,628 a205.0,10 0 0,0 410,0 v156 a205.0,10 0 0,1 -410,0 z" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><ellipse cx="1010.0" cy="628" rx="205.0" ry="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="1010.0" y="695.0" font-size="24" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">metadata-db</text><text x="1010.0" y="725.0" font-size="20" font-weight="normal" fill="#374151" text-anchor="middle" style="">画像・ラベル</text><text x="1010.0" y="750.0" font-size="20" font-weight="normal" fill="#374151" text-anchor="middle" style="">胸部野・所見の推定</text><path d="M1240,628 a205.0,10 0 0,0 410,0 v156 a205.0,10 0 0,1 -410,0 z" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><ellipse cx="1445.0" cy="628" rx="205.0" ry="10" fill="#ece8fb" stroke="#6d55c9" stroke-width="1.8"/><text x="1445.0" y="695.0" font-size="24" font-weight="bold" fill="#3b2a86" text-anchor="middle" style="">ベクトル用クラスタ</text><text x="1445.0" y="725.0" font-size="20" font-weight="normal" fill="#374151" text-anchor="middle" style="">1 画像 1 行</text><text x="1445.0" y="750.0" font-size="20" font-weight="normal" fill="#374151" text-anchor="middle" style="">512・15・16 次元</text><path d="M730,766 L778,766" fill="none" stroke="#1f9e7a" stroke-width="3" marker-end="url(#arrow)" style="color:#1f9e7a"/><rect x="30" y="840" width="1640" height="42" rx="6" fill="#fff8db" stroke="#e2c044" stroke-width="1.2"/><text x="40" y="872" font-size="22" font-weight="normal" fill="#6b4f00" text-anchor="start" style="">実績: EC2（GPU）で 112,066 枚を 231 分。画面は進捗を 1.5 秒ごとに更新</text></svg>
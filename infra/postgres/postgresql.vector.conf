# =============================================================================
# ベクトル用 Citus クラスタ（Coordinator / Worker 共通）の PostgreSQL 設定
#
# 1 ホストに Coordinator 1 + Worker 5 = 6 コンテナを同居させる前提の控えめな値。
# DB 専用のホストへ分ける場合は、実測に合わせてメモリ系の値を上げる。
#
# shard 数は migration が CITUS_SHARD_COUNT（.env）で明示するので、下の
# citus.shard_count は使われない。
# =============================================================================

data_directory = '/var/lib/postgresql/data'
hba_file = '/etc/postgresql/pg_hba.conf'
ident_file = '/var/lib/postgresql/data/pg_ident.conf'

listen_addresses = '*'
port = 5432
max_connections = 60

# --- メモリ -----------------------------------------------------------------
shared_buffers = 192MB
effective_cache_size = 512MB
work_mem = 8MB
maintenance_work_mem = 192MB

# --- ストレージ -------------------------------------------------------------
effective_io_concurrency = 200
random_page_cost = 1.1
wal_compression = on
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 2GB
min_wal_size = 256MB

# --- 並列 -------------------------------------------------------------------
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 2
max_parallel_maintenance_workers = 2

# --- 拡張 -------------------------------------------------------------------
shared_preload_libraries = 'citus'
citus.shard_count = 24
citus.max_adaptive_executor_pool_size = 16

# --- タイムアウト -----------------------------------------------------------
# 既定は 0（無制限）とし、role 単位（app_search=5s / app_ingest=30s）と
# トランザクション単位の SET LOCAL で制御する。HNSW index build や
# 初期一括ロードを global な statement_timeout で落とさないため。
statement_timeout = 0
lock_timeout = '10s'
idle_in_transaction_session_timeout = '60s'

# --- 監視・ログ -------------------------------------------------------------
track_io_timing = on
log_min_duration_statement = 1000
log_destination = 'stderr'
logging_collector = off
log_line_prefix = '%m [%p] %q%u@%d '
password_encryption = scram-sha-256

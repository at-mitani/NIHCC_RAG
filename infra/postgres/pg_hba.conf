# =============================================================================
# クライアント認証
#
# - trust 認証は使用しない。すべて scram-sha-256。
# - Docker の内部ネットワーク（既定 172.16.0.0/12）のみ許可し、他は reject。
# - 本番相当環境では hostssl へ切り替え、CIDR を実際のネットワーク設計に置換し、
#   server certificate と ssl=on を設定する。
#   Windows の bind mount では鍵ファイルの権限を 0600 にできず PostgreSQL が
#   起動を拒否するため、開発 compose では TLS を既定で無効にしている。
# =============================================================================

# TYPE  DATABASE  USER      ADDRESS         METHOD
local   all       all                       scram-sha-256
host    all       all       127.0.0.1/32    scram-sha-256
host    all       all       ::1/128         scram-sha-256

# コンテナ間（Citus Coordinator ⇔ Worker、アプリケーション ⇒ Coordinator）
host    all       all       172.16.0.0/12   scram-sha-256
host    all       all       192.168.0.0/16  scram-sha-256
host    all       all       10.0.0.0/8      scram-sha-256

# 上記以外は明示的に拒否する
host    all       all       0.0.0.0/0       reject
host    all       all       ::/0            reject

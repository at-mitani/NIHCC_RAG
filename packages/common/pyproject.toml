[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nihcc-rag-common"
version = "1.0.0"
description = "NIHCC chest X-ray local RAG system - shared contracts, DB access, queue and utilities"
requires-python = ">=3.11"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nihcc_rag = ["resources/*.yaml", "resources/*.json"]
